[project]
name = "support-agent"
version = "1.0.0"
description = "Support agent cu acțiuni controlate: RAG, tools, auth, state, guardrails, audit, evaluare"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.11", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
