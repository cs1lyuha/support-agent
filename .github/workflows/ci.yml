name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Teste unitare + API
        run: pytest -q
      - name: Evaluare agent (offline, determinist)
        run: python -m eval.run_eval --brain offline
